name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
              fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      

      - name: Run lint
        run: npx turbo lint --filter=...[HEAD^1]

      - name: Run tests
        run: npx turbo test:coverage --filter=...[HEAD^1]

      - name: Cache Docker image
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: /tmp/pet-alert-postgres.tar
          key: ${{ runner.os }}-docker-${{ hashFiles('docker/postgres/Dockerfile') }}

      - name: Build Docker image if not cached
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          docker build -t pet-alert-postgres:latest -f docker/postgres/Dockerfile docker/postgres
          docker save pet-alert-postgres:latest -o /tmp/pet-alert-postgres.tar

      - name: Load Docker image if cached
        if: steps.cache-docker.outputs.cache-hit == 'true'
        run: docker load -i /tmp/pet-alert-postgres.tar

      - name: Run integration tests
        run: npm run test:integration

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/coverage/**"

  # Proximamente se agregará un job de deploy que se ejecutará solo en la rama main        
  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy
        run: echo "deploy"